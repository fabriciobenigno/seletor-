<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Finger Selection Cinematic</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    overflow: hidden;
    touch-action: none;
}

/* Área 16:9 real centralizada */
#cinema {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 100vw;
    height: 56.25vw; /* 16:9 */
    max-height: 100vh;
    max-width: 177.77vh;
    transform: translate(-50%, -50%);
    background: #000;
    overflow: hidden;
}

/* Círculo */
.touch-circle {
    position: absolute;
    width: 85px;
    height: 85px;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.5);
    transition: opacity 0.4s ease, transform 0.4s ease;
}

/* Ativo */
.touch-circle.active {
    opacity: 0.9;
    transform: translate(-50%, -50%) scale(1);
}

/* Fade out */
.touch-circle.fade-out {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.4);
}

/* Dim */
.touch-circle.dim {
    opacity: 0.15 !important;
}

/* Selecionado */
.touch-circle.selected {
    animation: winnerPulse 1.2s ease-in-out infinite alternate;
    z-index: 10;
}

@keyframes winnerPulse {
    from {
        transform: translate(-50%, -50%) scale(1);
        box-shadow: 0 0 20px currentColor,
                    0 0 40px currentColor;
    }
    to {
        transform: translate(-50%, -50%) scale(1.4);
        box-shadow: 0 0 40px currentColor,
                    0 0 80px currentColor;
    }
}
</style>
</head>
<body>

<div id="cinema"></div>

<script>

const container = document.getElementById("cinema");

const baseColors = [
    "#00FFFF",
    "#FF00FF",
    "#FFD700",
    "#00FF7F",
    "#FF4500",
    "#8A2BE2"
];

let availableColors = [...baseColors];
let activeTouches = new Map();
let selectionTimer = null;

/* Cor sem repetir */
function getColor() {
    if (availableColors.length === 0) {
        availableColors = [...baseColors];
    }
    const index = Math.floor(Math.random() * availableColors.length);
    return availableColors.splice(index, 1)[0];
}

/* Posição correta dentro do 16:9 */
function getRelativePosition(touch) {
    const rect = container.getBoundingClientRect();
    return {
        x: touch.clientX - rect.left,
        y: touch.clientY - rect.top
    };
}

/* Reinicia contagem */
function restartTimer() {
    if (selectionTimer) {
        clearTimeout(selectionTimer);
        selectionTimer = null;
    }

    if (activeTouches.size >= 2) {
        selectionTimer = setTimeout(selectRandom, 3000);
    }
}

/* Seleção aleatória */
function selectRandom() {
    if (activeTouches.size < 2) return;

    const keys = Array.from(activeTouches.keys());
    const winnerKey = keys[Math.floor(Math.random() * keys.length)];

    keys.forEach(key => {
        const circle = activeTouches.get(key);
        if (key === winnerKey) {
            circle.classList.add("selected");
        } else {
            circle.classList.add("dim");
        }
    });
}

/* TOUCH START */
container.addEventListener("touchstart", e => {
    e.preventDefault();

    for (let touch of e.changedTouches) {

        if (activeTouches.size >= 6) return;
        if (activeTouches.has(touch.identifier)) continue;

        const pos = getRelativePosition(touch);

        const circle = document.createElement("div");
        circle.classList.add("touch-circle");

        const color = getColor();
        circle.style.background =
            `radial-gradient(circle,
            ${color} 0%,
            ${color}99 40%,
            ${color}55 60%,
            transparent 75%)`;

        circle.style.color = color;
        circle.style.left = pos.x + "px";
        circle.style.top = pos.y + "px";

        container.appendChild(circle);

        requestAnimationFrame(() => {
            circle.classList.add("active");
        });

        activeTouches.set(touch.identifier, circle);
    }

    restartTimer();
});

/* TOUCH MOVE */
container.addEventListener("touchmove", e => {
    e.preventDefault();

    for (let touch of e.changedTouches) {
        const circle = activeTouches.get(touch.identifier);
        if (!circle) continue;

        const pos = getRelativePosition(touch);
        circle.style.left = pos.x + "px";
        circle.style.top = pos.y + "px";
    }
});

/* TOUCH END */
container.addEventListener("touchend", e => {
    e.preventDefault();

    for (let touch of e.changedTouches) {
        const circle = activeTouches.get(touch.identifier);
        if (!circle) continue;

        circle.classList.add("fade-out");

        setTimeout(() => {
            circle.remove();
        }, 400);

        availableColors.push(circle.style.color);
        activeTouches.delete(touch.identifier);
    }

    restartTimer();
});

/* TOUCH CANCEL */
container.addEventListener("touchcancel", e => {
    for (let touch of e.changedTouches) {
        const circle = activeTouches.get(touch.identifier);
        if (!circle) continue;

        circle.remove();
        activeTouches.delete(touch.identifier);
    }

    restartTimer();
});

</script>

</body>
</html>
