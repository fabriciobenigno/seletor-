<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<title>Finger Selection Stable</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    overflow: hidden;

    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}

#app {
    position: fixed;
    inset: 0;
    background: #000;
    overflow: hidden;
}

/* CÍRCULO */
.touch-circle {
    position: absolute;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    pointer-events: none;

    opacity: 0;
    transform: translate(-50%, -50%) scale(0.6);
    transition: opacity 0.25s ease, transform 0.25s ease;
}

.touch-circle.active {
    opacity: 0.95;
    transform: translate(-50%, -50%) scale(1);
}

.touch-circle.fade-out {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.5);
}

.touch-circle.dim {
    opacity: 0.15 !important;
}

.touch-circle.selected {
    animation: winnerPulse 1s ease-in-out infinite alternate;
    z-index: 10;
}

@keyframes winnerPulse {
    from {
        transform: translate(-50%, -50%) scale(1);
        box-shadow:
            0 0 20px currentColor,
            0 0 40px currentColor;
    }
    to {
        transform: translate(-50%, -50%) scale(1.35);
        box-shadow:
            0 0 40px currentColor,
            0 0 80px currentColor;
    }
}

</style>
</head>
<body>

<div id="app"></div>

<script>

document.addEventListener("contextmenu", e => e.preventDefault());

const app = document.getElementById("app");

const baseColors = [
    "#00FFFF",
    "#FF00FF",
    "#FFD700",
    "#00FF7F",
    "#FF4500",
    "#8A2BE2"
];

let availableColors = [...baseColors];
let activeTouches = {};
let selectionTimer = null;

/* Cor sem repetir */
function getColor() {
    if (availableColors.length === 0) {
        availableColors = [...baseColors];
    }

    const index = Math.floor(Math.random() * availableColors.length);
    return availableColors.splice(index, 1)[0];
}

/* Reinicia contagem */
function restartTimer() {
    if (selectionTimer) {
        clearTimeout(selectionTimer);
        selectionTimer = null;
    }

    if (Object.keys(activeTouches).length >= 2) {
        selectionTimer = setTimeout(selectRandom, 3000);
    }
}

/* Seleciona */
function selectRandom() {

    const keys = Object.keys(activeTouches);
    if (keys.length < 2) return;

    const winner = keys[Math.floor(Math.random() * keys.length)];

    keys.forEach(id => {
        if (id === winner) {
            activeTouches[id].classList.add("selected");
        } else {
            activeTouches[id].classList.add("dim");
        }
    });
}

/* TOUCH START */
app.addEventListener("touchstart", function(e) {

    for (let i = 0; i < e.changedTouches.length; i++) {

        const touch = e.changedTouches[i];

        if (Object.keys(activeTouches).length >= 6) return;

        if (activeTouches[touch.identifier]) continue;

        const circle = document.createElement("div");
        circle.className = "touch-circle";

        const color = getColor();

        circle.style.background =
            `radial-gradient(circle,
            ${color} 0%,
            ${color}AA 40%,
            ${color}55 65%,
            transparent 80%)`;

        circle.style.color = color;
        circle.style.left = touch.clientX + "px";
        circle.style.top = touch.clientY + "px";

        app.appendChild(circle);

        setTimeout(() => {
            circle.classList.add("active");
        }, 10);

        activeTouches[touch.identifier] = circle;
    }

    restartTimer();
}, { passive: true });

/* TOUCH MOVE */
app.addEventListener("touchmove", function(e) {

    for (let i = 0; i < e.changedTouches.length; i++) {

        const touch = e.changedTouches[i];
        const circle = activeTouches[touch.identifier];
        if (!circle) continue;

        circle.style.left = touch.clientX + "px";
        circle.style.top = touch.clientY + "px";
    }

}, { passive: true });

/* TOUCH END */
app.addEventListener("touchend", function(e) {

    for (let i = 0; i < e.changedTouches.length; i++) {

        const touch = e.changedTouches[i];
        const circle = activeTouches[touch.identifier];
        if (!circle) continue;

        circle.classList.add("fade-out");

        setTimeout(() => {
            if (circle.parentNode) circle.remove();
        }, 250);

        availableColors.push(circle.style.color);
        delete activeTouches[touch.identifier];
    }

    restartTimer();
}, { passive: true });

/* TOUCH CANCEL (importante no iOS) */
app.addEventListener("touchcancel", function(e) {

    for (let i = 0; i < e.changedTouches.length; i++) {

        const touch = e.changedTouches[i];
        const circle = activeTouches[touch.identifier];
        if (!circle) continue;

        if (circle.parentNode) circle.remove();
        delete activeTouches[touch.identifier];
    }

    restartTimer();
}, { passive: true });

</script>

</body>
</html>
