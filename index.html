<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escolha Cinematográfica</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: radial-gradient(circle at center, #000 0%, #050505 100%);
    overflow: hidden;
    touch-action: none;
    height: 100%;
}

/* Vinheta cinematográfica */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, transparent 40%, black 100%);
    pointer-events: none;
}

/* Dedo */
.touch-point {
    position: absolute;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0.7);
    opacity: 0;
    filter: blur(20px);
    transition: 
        opacity 0.8s ease,
        transform 0.8s ease,
        filter 0.8s ease;
}

/* Fade in */
.touch-point.active {
    opacity: 1;
    filter: blur(0px);
    animation: breathe 3s ease-in-out infinite alternate;
}

/* Respiração suave */
@keyframes breathe {
    from { transform: translate(-50%, -50%) scale(1); }
    to { transform: translate(-50%, -50%) scale(1.12); }
}

/* Fade out */
.touch-point.fade-out {
    opacity: 0 !important;
    filter: blur(30px);
    transform: translate(-50%, -50%) scale(0.5);
}

/* Escurecer perdedores */
.dimmed {
    opacity: 0.15 !important;
    filter: blur(5px);
}

/* Vencedor cinematográfico */
.selected {
    animation: winnerPulse 1s ease-in-out infinite alternate;
    z-index: 20;
}

@keyframes winnerPulse {
    from {
        transform: translate(-50%, -50%) scale(1.3);
        box-shadow: 0 0 40px white;
    }
    to {
        transform: translate(-50%, -50%) scale(1.7);
        box-shadow: 0 0 120px white;
    }
}

/* Flash dramático */
.flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    animation: flashAnim 0.6s ease forwards;
}

@keyframes flashAnim {
    0% { opacity: 0.8; }
    100% { opacity: 0; }
}
</style>
</head>
<body>

<script>
const colors = [
    "#ff0033",
    "#00ffee",
    "#ffcc00",
    "#9933ff",
    "#00ff66",
    "#ff6600"
];

let touchesMap = {};
let selectionTimer = null;

function createTouch(touch) {
    if (Object.keys(touchesMap).length >= 6) return;

    const div = document.createElement("div");
    div.classList.add("touch-point");

    const color = colors[Object.keys(touchesMap).length % colors.length];

    div.style.background = `
        radial-gradient(circle at center,
        ${color} 0%,
        ${color}aa 30%,
        ${color}55 55%,
        transparent 75%)
    `;

    document.body.appendChild(div);

    touchesMap[touch.identifier] = {
        element: div
    };

    updateTouchPosition(touch);

    setTimeout(() => {
        div.classList.add("active");
    }, 10);

    startSelectionCountdown();
}

function updateTouchPosition(touch) {
    const touchData = touchesMap[touch.identifier];
    if (!touchData) return;

    touchData.element.style.left = touch.clientX + "px";
    touchData.element.style.top = touch.clientY + "px";
}

function removeTouch(touch) {
    const touchData = touchesMap[touch.identifier];
    if (!touchData) return;

    touchData.element.classList.add("fade-out");

    setTimeout(() => {
        touchData.element.remove();
    }, 800);

    delete touchesMap[touch.identifier];

    resetSelection();
}

function startSelectionCountdown() {
    if (Object.keys(touchesMap).length < 2) return;
    if (selectionTimer) return;

    selectionTimer = setTimeout(() => {
        selectRandomTouch();
    }, 3000);
}

function resetSelection() {
    clearTimeout(selectionTimer);
    selectionTimer = null;

    Object.values(touchesMap).forEach(t => {
        t.element.classList.remove("selected", "dimmed");
    });

    if (Object.keys(touchesMap).length >= 2) {
        startSelectionCountdown();
    }
}

function selectRandomTouch() {
    const keys = Object.keys(touchesMap);
    if (keys.length < 2) return;

    const randomKey = keys[Math.floor(Math.random() * keys.length)];

    /* Flash cinematográfico */
    const flash = document.createElement("div");
    flash.classList.add("flash");
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 600);

    Object.keys(touchesMap).forEach(key => {
        if (key !== randomKey) {
            touchesMap[key].element.classList.add("dimmed");
        }
    });

    touchesMap[randomKey].element.classList.add("selected");
}

document.addEventListener("touchstart", e => {
    for (let touch of e.changedTouches) {
        createTouch(touch);
    }
});

document.addEventListener("touchmove", e => {
    for (let touch of e.changedTouches) {
        updateTouchPosition(touch);
    }
});

document.addEventListener("touchend", e => {
    for (let touch of e.changedTouches) {
        removeTouch(touch);
    }
});

document.addEventListener("touchcancel", e => {
    for (let touch of e.changedTouches) {
        removeTouch(touch);
    }
});
</script>

</body>
</html>
