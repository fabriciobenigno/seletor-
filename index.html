<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Finger Selection Experience</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    touch-action: none;
    height: 100%;
    width: 100%;
}

/* Container 16:9 */
#cinema {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 100vw;
    height: 56.25vw; /* 16:9 */
    max-height: 100vh;
    max-width: 177.77vh;
    transform: translate(-50%, -50%);
    background: #000;
}

/* Círculo base */
.touch-circle {
    position: absolute;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.6);
    animation: fadeIn 0.4s ease forwards;
}

/* Glow animado */
.touch-circle::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    filter: blur(12px);
    opacity: 0.6;
}

/* Fade in */
@keyframes fadeIn {
    to {
        opacity: 0.85;
        transform: translate(-50%, -50%) scale(1);
    }
}

/* Fade out */
.fade-out {
    animation: fadeOut 0.4s ease forwards;
}

@keyframes fadeOut {
    to {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
    }
}

/* Selecionado */
.selected {
    animation: winner 1.5s ease forwards;
}

@keyframes winner {
    0% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.4); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0.2; }
}

</style>
</head>
<body>

<div id="cinema"></div>

<script>

const container = document.getElementById("cinema");

const colors = [
    "#00FFFF",
    "#FF00FF",
    "#FFD700",
    "#00FF7F",
    "#FF4500",
    "#8A2BE2"
];

let activeTouches = new Map();
let availableColors = [...colors];
let selectionTimer = null;

/* Pega cor sem repetir */
function getColor() {
    if (availableColors.length === 0) {
        availableColors = [...colors];
    }
    const index = Math.floor(Math.random() * availableColors.length);
    return availableColors.splice(index, 1)[0];
}

/* Reinicia contagem */
function restartTimer() {
    if (selectionTimer) clearTimeout(selectionTimer);

    if (activeTouches.size >= 2) {
        selectionTimer = setTimeout(selectRandom, 3000);
    }
}

/* Seleção */
function selectRandom() {
    if (activeTouches.size < 2) return;

    const keys = Array.from(activeTouches.keys());
    const chosenKey = keys[Math.floor(Math.random() * keys.length)];
    const chosenCircle = activeTouches.get(chosenKey);

    chosenCircle.classList.add("selected");
}

/* Touch start */
container.addEventListener("touchstart", e => {
    e.preventDefault();

    for (let touch of e.changedTouches) {
        if (activeTouches.has(touch.identifier)) continue;

        const circle = document.createElement("div");
        circle.classList.add("touch-circle");

        const color = getColor();
        circle.style.background = color;
        circle.style.boxShadow = `0 0 25px ${color}`;
        circle.style.left = touch.clientX + "px";
        circle.style.top = touch.clientY + "px";

        container.appendChild(circle);
        activeTouches.set(touch.identifier, circle);
    }

    restartTimer();
});

/* Touch move */
container.addEventListener("touchmove", e => {
    e.preventDefault();

    for (let touch of e.changedTouches) {
        const circle = activeTouches.get(touch.identifier);
        if (circle) {
            circle.style.left = touch.clientX + "px";
            circle.style.top = touch.clientY + "px";
        }
    }
});

/* Touch end */
container.addEventListener("touchend", e => {
    e.preventDefault();

    for (let touch of e.changedTouches) {
        const circle = activeTouches.get(touch.identifier);
        if (circle) {
            circle.classList.add("fade-out");
            setTimeout(() => circle.remove(), 400);
            activeTouches.delete(touch.identifier);
        }
    }

    restartTimer();
});

</script>

</body>
</html>
