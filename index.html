<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<!-- Viewport otimizado para iPhone -->
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<title>Finger Selection Cinematic</title>

<style>

/* BLOQUEIO TOTAL iOS */
html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    overflow: hidden;

    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
}

/* Remove qualquer seleção */
* {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

#app {
    position: fixed;
    inset: 0;
    background: #000;
    overflow: hidden;
}

/* CÍRCULO */
.touch-circle {
    position: absolute;
    width: 85px;
    height: 85px;
    border-radius: 50%;
    pointer-events: none;

    opacity: 0;
    transform: translate(-50%, -50%) scale(0.5);
    transition: opacity 0.35s ease, transform 0.35s ease;
}

/* Fade in */
.touch-circle.active {
    opacity: 0.9;
    transform: translate(-50%, -50%) scale(1);
}

/* Fade out */
.touch-circle.fade-out {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.4);
}

/* Escurecer perdedores */
.touch-circle.dim {
    opacity: 0.15 !important;
}

/* Vencedor */
.touch-circle.selected {
    animation: winnerPulse 1.2s ease-in-out infinite alternate;
    z-index: 10;
}

@keyframes winnerPulse {
    from {
        transform: translate(-50%, -50%) scale(1);
        box-shadow:
            0 0 20px currentColor,
            0 0 40px currentColor;
    }
    to {
        transform: translate(-50%, -50%) scale(1.4);
        box-shadow:
            0 0 40px currentColor,
            0 0 80px currentColor;
    }
}

</style>
</head>
<body>

<div id="app"></div>

<script>

/* BLOQUEIOS EXTRAS iOS */
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("gesturechange", e => e.preventDefault());
document.addEventListener("gestureend", e => e.preventDefault());

const app = document.getElementById("app");

const baseColors = [
    "#00FFFF",
    "#FF00FF",
    "#FFD700",
    "#00FF7F",
    "#FF4500",
    "#8A2BE2"
];

let availableColors = [...baseColors];
let activeTouches = new Map();
let selectionTimer = null;

/* Cor sem repetir */
function getColor() {
    if (availableColors.length === 0) {
        availableColors = [...baseColors];
    }

    const index = Math.floor(Math.random() * availableColors.length);
    return availableColors.splice(index, 1)[0];
}

/* Reinicia contagem */
function restartTimer() {
    if (selectionTimer) {
        clearTimeout(selectionTimer);
        selectionTimer = null;
    }

    if (activeTouches.size >= 2) {
        selectionTimer = setTimeout(selectRandom, 3000);
    }
}

/* Seleção aleatória */
function selectRandom() {
    if (activeTouches.size < 2) return;

    const keys = Array.from(activeTouches.keys());
    const winnerKey = keys[Math.floor(Math.random() * keys.length)];

    keys.forEach(key => {
        const circle = activeTouches.get(key);

        if (key === winnerKey) {
            circle.classList.add("selected");
        } else {
            circle.classList.add("dim");
        }
    });
}

/* TOUCH START */
app.addEventListener("touchstart", e => {

    e.preventDefault();

    for (let touch of e.changedTouches) {

        if (activeTouches.size >= 6) return;
        if (activeTouches.has(touch.identifier)) continue;

        const circle = document.createElement("div");
        circle.classList.add("touch-circle");

        const color = getColor();

        circle.style.background =
            `radial-gradient(circle,
            ${color} 0%,
            ${color}AA 40%,
            ${color}55 65%,
            transparent 80%)`;

        circle.style.color = color;
        circle.style.left = touch.clientX + "px";
        circle.style.top = touch.clientY + "px";

        app.appendChild(circle);

        requestAnimationFrame(() => {
            circle.classList.add("active");
        });

        activeTouches.set(touch.identifier, circle);
    }

    restartTimer();
});

/* TOUCH MOVE */
app.addEventListener("touchmove", e => {

    e.preventDefault();

    for (let touch of e.changedTouches) {
        const circle = activeTouches.get(touch.identifier);
        if (!circle) continue;

        circle.style.left = touch.clientX + "px";
        circle.style.top = touch.clientY + "px";
    }
});

/* TOUCH END */
app.addEventListener("touchend", e => {

    e.preventDefault();

    for (let touch of e.changedTouches) {

        const circle = activeTouches.get(touch.identifier);
        if (!circle) continue;

        circle.classList.add("fade-out");

        setTimeout(() => {
            circle.remove();
        }, 350);

        availableColors.push(circle.style.color);
        activeTouches.delete(touch.identifier);
    }

    restartTimer();
});

/* TOUCH CANCEL */
app.addEventListener("touchcancel", e => {

    for (let touch of e.changedTouches) {

        const circle = activeTouches.get(touch.identifier);
        if (!circle) continue;

        circle.remove();
        activeTouches.delete(touch.identifier);
    }

    restartTimer();
});

</script>

</body>
</html>
