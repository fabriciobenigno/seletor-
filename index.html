<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Touch Cinematic</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    overflow: hidden;
    touch-action: none;
}

#container {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000;
    overflow: hidden;
}

/* CÍRCULO */
.touch {
    position: absolute;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
    pointer-events: none;

    transition:
        transform 0.35s ease,
        opacity 0.35s ease;

    backdrop-filter: blur(10px) saturate(160%);
    -webkit-backdrop-filter: blur(10px) saturate(160%);
    border: 2px solid rgba(255,255,255,0.2);
}

/* ENTRADA */
.touch.active {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
}

/* SELECIONADO */
.touch.selected {
    animation: pulse 1s ease forwards;
}

@keyframes pulse {
    0%   { transform: translate(-50%, -50%) scale(1); }
    40%  { transform: translate(-50%, -50%) scale(1.7); }
    70%  { transform: translate(-50%, -50%) scale(1.4); }
    100% { transform: translate(-50%, -50%) scale(1.5); }
}
</style>
</head>

<body>
<div id="container"></div>

<script>
const container = document.getElementById("container");

const colors = [
    "#FF3B30",
    "#34C759",
    "#007AFF",
    "#FF9500",
    "#AF52DE",
    "#5AC8FA"
];

let touchesMap = {};
let usedColors = [];
let timer = null;

/* Reinicia contador */
function restartTimer() {
    clearTimeout(timer);
    if (Object.keys(touchesMap).length > 0) {
        timer = setTimeout(selectRandom, 3000);
    }
}

/* Seleciona aleatório */
function selectRandom() {
    const keys = Object.keys(touchesMap);
    if (keys.length === 0) return;

    const randomKey = keys[Math.floor(Math.random() * keys.length)];
    touchesMap[randomKey].classList.add("selected");
}

/* Touch Start */
container.addEventListener("touchstart", (e) => {

    Array.from(e.changedTouches).forEach(touch => {

        if (Object.keys(touchesMap).length >= 6) return;

        const circle = document.createElement("div");
        circle.classList.add("touch");

        // escolher cor não repetida
        const available = colors.filter(c => !usedColors.includes(c));
        const color = available.length > 0
            ? available[Math.floor(Math.random() * available.length)]
            : colors[Math.floor(Math.random() * colors.length)];

        circle.style.background = color;
        usedColors.push(color);

        circle.style.left = touch.clientX + "px";
        circle.style.top = touch.clientY + "px";

        container.appendChild(circle);

        requestAnimationFrame(() => {
            circle.classList.add("active");
        });

        touchesMap[touch.identifier] = circle;
    });

    restartTimer();
});

/* Touch Move */
container.addEventListener("touchmove", (e) => {

    Array.from(e.changedTouches).forEach(touch => {
        const circle = touchesMap[touch.identifier];
        if (circle) {
            circle.style.left = touch.clientX + "px";
            circle.style.top = touch.clientY + "px";
        }
    });

}, { passive: true });

/* Touch End */
container.addEventListener("touchend", (e) => {

    Array.from(e.changedTouches).forEach(touch => {
        const circle = touchesMap[touch.identifier];
        if (circle) {

            circle.classList.remove("active");

            setTimeout(() => {
                if (circle.parentNode) {
                    container.removeChild(circle);
                }
            }, 350);

            const bg = circle.style.background;
            usedColors = usedColors.filter(c => c !== bg);

            delete touchesMap[touch.identifier];
        }
    });

    restartTimer();
});

/* Touch Cancel */
container.addEventListener("touchcancel", (e) => {

    Array.from(e.changedTouches).forEach(touch => {
        const circle = touchesMap[touch.identifier];
        if (circle) {
            container.removeChild(circle);
            delete touchesMap[touch.identifier];
        }
    });

    restartTimer();
});
</script>

</body>
</html>
