<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Cinema Touch</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: radial-gradient(circle at center, #000 0%, #050505 100%);
    overflow: hidden;
    touch-action: none;
    height: 100%;
}

/* Vinheta cinematográfica */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.95) 100%);
    pointer-events: none;
}

/* Círculo base */
.touch-point {
    position: absolute;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0.7);
    opacity: 0;
    filter: blur(20px);
    transition:
        opacity 0.6s ease,
        transform 0.6s ease,
        filter 0.6s ease;
}

/* Fade in */
.touch-point.active {
    opacity: 1;
    filter: blur(0px);
    animation: breathe 2.5s ease-in-out infinite alternate;
}

/* Respiração suave */
@keyframes breathe {
    from { transform: translate(-50%, -50%) scale(1); }
    to   { transform: translate(-50%, -50%) scale(1.12); }
}

/* Fade out */
.fade-out {
    opacity: 0 !important;
    transform: translate(-50%, -50%) scale(0.4);
    filter: blur(30px);
}

/* Escurecer perdedores */
.dimmed {
    opacity: 0.15 !important;
    filter: blur(6px);
}

/* Vencedor */
.selected {
    animation: winnerPulse 1s ease-in-out infinite alternate;
    z-index: 20;
}

@keyframes winnerPulse {
    from {
        transform: translate(-50%, -50%) scale(1.2);
        box-shadow: 0 0 30px currentColor,
                    0 0 60px currentColor;
    }
    to {
        transform: translate(-50%, -50%) scale(1.5);
        box-shadow: 0 0 60px currentColor,
                    0 0 120px currentColor;
    }
}
</style>
</head>
<body>

<script>
const baseColors = [
    "#ff0040",
    "#00e5ff",
    "#ffcc00",
    "#8e44ff",
    "#00ff88",
    "#ff6600"
];

let availableColors = [...baseColors];
let touchesMap = {};
let selectionTimer = null;

/* Reinicia contagem */
function restartCountdown() {
    clearTimeout(selectionTimer);
    selectionTimer = null;

    if (Object.keys(touchesMap).length >= 2) {
        selectionTimer = setTimeout(selectRandomTouch, 3000);
    }
}

/* Pega cor sem repetir */
function getNextColor() {
    if (availableColors.length === 0) {
        availableColors = [...baseColors];
    }

    const index = Math.floor(Math.random() * availableColors.length);
    const color = availableColors[index];
    availableColors.splice(index, 1);
    return color;
}

/* Criar dedo */
function createTouch(touch) {
    if (Object.keys(touchesMap).length >= 6) return;

    const div = document.createElement("div");
    div.classList.add("touch-point");

    const color = getNextColor();

    div.style.background =
        `radial-gradient(circle at center,
        ${color} 0%,
        ${color}aa 35%,
        ${color}55 60%,
        transparent 75%)`;

    div.style.color = color;

    document.body.appendChild(div);

    touchesMap[touch.identifier] = {
        element: div,
        color: color
    };

    updateTouchPosition(touch);

    setTimeout(() => div.classList.add("active"), 10);

    restartCountdown();
}

/* Atualizar posição */
function updateTouchPosition(touch) {
    const data = touchesMap[touch.identifier];
    if (!data) return;

    data.element.style.left = touch.clientX + "px";
    data.element.style.top = touch.clientY + "px";
}

/* Remover dedo */
function removeTouch(touch) {
    const data = touchesMap[touch.identifier];
    if (!data) return;

    data.element.classList.add("fade-out");

    setTimeout(() => data.element.remove(), 600);

    availableColors.push(data.color);

    delete touchesMap[touch.identifier];

    restartCountdown();
}

/* Seleção aleatória */
function selectRandomTouch() {
    const keys = Object.keys(touchesMap);
    if (keys.length < 2) return;

    const winnerKey = keys[Math.floor(Math.random() * keys.length)];

    keys.forEach(key => {
        if (key !== winnerKey) {
            touchesMap[key].element.classList.add("dimmed");
        }
    });

    touchesMap[winnerKey].element.classList.add("selected");
}

/* Eventos touch */
document.addEventListener("touchstart", e => {
    for (let touch of e.changedTouches) {
        createTouch(touch);
    }
});

document.addEventListener("touchmove", e => {
    for (let touch of e.changedTouches) {
        updateTouchPosition(touch);
    }
});

document.addEventListener("touchend", e => {
    for (let touch of e.changedTouches) {
        removeTouch(touch);
    }
});

document.addEventListener("touchcancel", e => {
    for (let touch of e.changedTouches) {
        removeTouch(touch);
    }
});
</script>

</body>
</html>
