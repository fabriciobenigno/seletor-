<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Cinema Touch</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: radial-gradient(circle at center, #000 0%, #050505 100%);
    overflow: hidden;
    touch-action: none;
    height: 100%;
}

/* VINHETA CINEMATOGRÁFICA */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.9) 100%);
    pointer-events: none;
}

/* DEDOS */
.touch-point {
    position: absolute;
    width: 170px;
    height: 170px;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0.6);
    opacity: 0;
    filter: blur(25px);
    transition:
        opacity 0.8s ease,
        transform 0.8s ease,
        filter 0.8s ease;
}

.touch-point.active {
    opacity: 1;
    filter: blur(0px);
    animation: breathe 3s ease-in-out infinite alternate;
}

@keyframes breathe {
    from { transform: translate(-50%, -50%) scale(1); }
    to   { transform: translate(-50%, -50%) scale(1.15); }
}

.fade-out {
    opacity: 0 !important;
    transform: translate(-50%, -50%) scale(0.4);
    filter: blur(35px);
}

.dimmed {
    opacity: 0.15 !important;
    filter: blur(8px);
}

.selected {
    animation: winnerPulse 1s ease-in-out infinite alternate;
    z-index: 20;
}

@keyframes winnerPulse {
    from {
        transform: translate(-50%, -50%) scale(1.3);
        box-shadow: 0 0 40px white;
    }
    to {
        transform: translate(-50%, -50%) scale(1.8);
        box-shadow: 0 0 150px white;
    }
}

/* FLASH DRAMÁTICO */
.flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    animation: flashAnim 0.6s ease forwards;
}

@keyframes flashAnim {
    0% { opacity: 0.8; }
    100% { opacity: 0; }
}
</style>
</head>
<body>

<script>
const colors = [
    "#ff0033",
    "#00ffee",
    "#ffcc00",
    "#9933ff",
    "#00ff66",
    "#ff6600"
];

let touchesMap = {};
let selectionTimer = null;

/* REINICIAR CONTAGEM */
function restartCountdown() {
    clearTimeout(selectionTimer);
    selectionTimer = null;

    if (Object.keys(touchesMap).length >= 2) {
        selectionTimer = setTimeout(selectRandomTouch, 3000);
    }
}

/* CRIAR DEDO */
function createTouch(touch) {
    if (Object.keys(touchesMap).length >= 6) return;

    const div = document.createElement("div");
    div.classList.add("touch-point");

    const color = colors[Object.keys(touchesMap).length % colors.length];

    div.style.background =
        `radial-gradient(circle at center,
        ${color} 0%,
        ${color}aa 30%,
        ${color}55 55%,
        transparent 75%)`;

    document.body.appendChild(div);

    touchesMap[touch.identifier] = div;

    updateTouchPosition(touch);

    setTimeout(() => {
        div.classList.add("active");
    }, 10);

    restartCountdown();
}

/* ATUALIZAR POSIÇÃO */
function updateTouchPosition(touch) {
    const div = touchesMap[touch.identifier];
    if (!div) return;

    div.style.left = touch.clientX + "px";
    div.style.top = touch.clientY + "px";
}

/* REMOVER DEDO */
function removeTouch(touch) {
    const div = touchesMap[touch.identifier];
    if (!div) return;

    div.classList.add("fade-out");

    setTimeout(() => {
        div.remove();
    }, 800);

    delete touchesMap[touch.identifier];

    restartCountdown();
}

/* SELECIONAR ALEATÓRIO */
function selectRandomTouch() {
    const keys = Object.keys(touchesMap);
    if (keys.length < 2) return;

    const randomKey = keys[Math.floor(Math.random() * keys.length)];

    /* FLASH CINEMATOGRÁFICO */
    const flash = document.createElement("div");
    flash.classList.add("flash");
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 600);

    keys.forEach(key => {
        if (key !== randomKey) {
            touchesMap[key].classList.add("dimmed");
        }
    });

    touchesMap[randomKey].classList.add("selected");
}

/* EVENTOS TOUCH */
document.addEventListener("touchstart", e => {
    for (let touch of e.changedTouches) {
        createTouch(touch);
    }
});

document.addEventListener("touchmove", e => {
    for (let touch of e.changedTouches) {
        updateTouchPosition(touch);
    }
});

document.addEventListener("touchend", e => {
    for (let touch of e.changedTouches) {
        removeTouch(touch);
    }
});

document.addEventListener("touchcancel", e => {
    for (let touch of e.changedTouches) {
        removeTouch(touch);
    }
});
</script>

</body>
</html>
