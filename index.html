<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<title>Finger Selection Cinematic</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    overflow: hidden;

    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
}

* {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

#app {
    position: fixed;
    inset: 0;
    background: #000;
    overflow: hidden;
}

/* CÍRCULO */
.touch-circle {
    position: absolute;
    width: 85px;
    height: 85px;
    border-radius: 50%;
    pointer-events: none;

    opacity: 0;
    transform: translate(-50%, -50%) scale(0.5);
    transition: opacity 0.15s ease, transform 0.15s ease;
}

.touch-circle.active {
    opacity: 0.95;
    transform: translate(-50%, -50%) scale(1);
}

.touch-circle.fade-out {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.4);
}

.touch-circle.dim {
    opacity: 0.15 !important;
}

.touch-circle.selected {
    animation: winnerPulse 0.8s ease-in-out infinite alternate;
    z-index: 10;
}

@keyframes winnerPulse {
    from {
        transform: translate(-50%, -50%) scale(1);
        box-shadow: 0 0 20px currentColor,
                    0 0 40px currentColor;
    }
    to {
        transform: translate(-50%, -50%) scale(1.3);
        box-shadow: 0 0 40px currentColor,
                    0 0 80px currentColor;
    }
}

</style>
</head>
<body>

<div id="app"></div>

<script>

/* Bloqueios extras */
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("gesturestart", e => e.preventDefault());

const app = document.getElementById("app");

const baseColors = [
    "#00FFFF",
    "#FF00FF",
    "#FFD700",
    "#00FF7F",
    "#FF4500",
    "#8A2BE2"
];

let availableColors = [...baseColors];
let activePointers = new Map();
let selectionTimer = null;

/* Cor sem repetir */
function getColor() {
    if (availableColors.length === 0) {
        availableColors = [...baseColors];
    }
    const index = Math.floor(Math.random() * availableColors.length);
    return availableColors.splice(index, 1)[0];
}

/* Reinicia contagem */
function restartTimer() {
    if (selectionTimer) clearTimeout(selectionTimer);
    if (activePointers.size >= 2) {
        selectionTimer = setTimeout(selectRandom, 3000);
    }
}

/* Seleção */
function selectRandom() {
    if (activePointers.size < 2) return;

    const keys = Array.from(activePointers.keys());
    const winnerKey = keys[Math.floor(Math.random() * keys.length)];

    keys.forEach(key => {
        const circle = activePointers.get(key);
        if (key === winnerKey) {
            circle.classList.add("selected");
        } else {
            circle.classList.add("dim");
        }
    });
}

/* ===== POINTER EVENTS (ULTRA RESPONSIVO) ===== */

app.addEventListener("pointerdown", e => {

    if (activePointers.size >= 6) return;

    const circle = document.createElement("div");
    circle.classList.add("touch-circle");

    const color = getColor();

    circle.style.background =
        `radial-gradient(circle,
        ${color} 0%,
        ${color}AA 40%,
        ${color}55 65%,
        transparent 80%)`;

    circle.style.color = color;
    circle.style.left = e.clientX + "px";
    circle.style.top = e.clientY + "px";

    app.appendChild(circle);

    requestAnimationFrame(() => {
        circle.classList.add("active");
    });

    activePointers.set(e.pointerId, circle);

    restartTimer();
});

app.addEventListener("pointermove", e => {

    const circle = activePointers.get(e.pointerId);
    if (!circle) return;

    circle.style.left = e.clientX + "px";
    circle.style.top = e.clientY + "px";
});

app.addEventListener("pointerup", e => {

    const circle = activePointers.get(e.pointerId);
    if (!circle) return;

    circle.classList.add("fade-out");

    setTimeout(() => circle.remove(), 150);

    availableColors.push(circle.style.color);
    activePointers.delete(e.pointerId);

    restartTimer();
});

app.addEventListener("pointercancel", e => {

    const circle = activePointers.get(e.pointerId);
    if (!circle) return;

    circle.remove();
    activePointers.delete(e.pointerId);

    restartTimer();
});

</script>

</body>
</html>
